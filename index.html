<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0e13" />
    <meta
      name="description"
      content="Tempo is a chess opening repertoire builder and spaced-repetition trainer. Build lines for White and Black, then drill them against the moves you actually face."
    />
    <title>Tempo — Chess opening trainer</title>
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem('tempo-state'))
        if (saved && saved.state && saved.state.settings.theme === 'light') {
          document.documentElement.classList.add('light')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
